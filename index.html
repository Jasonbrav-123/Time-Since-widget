<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141412">
<title>Since</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Since">
<style>
  :root {
    --bg: #141412;
    --card: #1d1d1a;
    --card-hover: #242420;
    --line: rgba(255,255,255,0.08);
    --text: #f2f1ec;
    --text-dim: #98978c;
    --accent: #5dcaa5;
    --danger: #d4537e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  body {
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 520px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 20px 4px 12px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.02em;
  }
  #addBtn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #addBtn:active { background: var(--card-hover); }

  #list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    position: relative;
  }
  .card .name {
    font-size: 14px;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .unit { text-align: center; }
  .unit .num {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .unit .lbl {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .card .date {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 12px;
  }
  .del {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    padding: 4px 8px;
    cursor: pointer;
  }

  #empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.6;
  }

  dialog {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    width: min(360px, 90vw);
  }
  dialog::backdrop { background: rgba(0,0,0,0.5); }
  dialog h2 { font-size: 17px; margin: 0 0 14px; font-weight: 600; }
  dialog label { font-size: 12px; color: var(--text-dim); display: block; margin: 12px 0 6px; }
  dialog input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
  }
  .dlg-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .dlg-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .dlg-actions button.primary {
    background: var(--accent);
    color: #04342c;
    border-color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <h1>Since</h1>
  <button id="addBtn" aria-label="Add tracker">+</button>
</header>

<div id="list"></div>
<div id="empty" style="display:none;">No trackers yet.<br>Tap + to start one.</div>

<dialog id="dlg">
  <h2>New tracker</h2>
  <label for="tName">Name</label>
  <input id="tName" type="text" placeholder="e.g. Since I quit smoking">
  <label for="tDate">Date and time</label>
  <input id="tDate" type="datetime-local">
  <div class="dlg-actions">
    <button id="cancelBtn">Cancel</button>
    <button id="saveBtn" class="primary">Add</button>
  </div>
</dialog>

<script>
const STORAGE_KEY = 'since-trackers';

function loadTrackers() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  // first run default
  return [{ id: 'default', name: 'Tracking since', date: '2026-04-24T00:00' }];
}

function saveTrackers(trackers) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(trackers));
}

let trackers = loadTrackers();

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const dlg = document.getElementById('dlg');

function render() {
  listEl.innerHTML = '';
  if (trackers.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  trackers.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = t.id;
    const dateObj = new Date(t.date);
    card.innerHTML = `
      <button class="del" aria-label="Delete tracker" data-id="${t.id}">&times;</button>
      <p class="name">${escapeHtml(t.name)}</p>
      <div class="grid">
        <div class="unit"><div class="num d">0</div><div class="lbl">days</div></div>
        <div class="unit"><div class="num h">0</div><div class="lbl">hrs</div></div>
        <div class="unit"><div class="num m">0</div><div class="lbl">min</div></div>
        <div class="unit"><div class="num s">0</div><div class="lbl">sec</div></div>
      </div>
      <p class="date">${dateObj.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}</p>
    `;
    listEl.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function tick() {
  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    const t = trackers.find(x => x.id === id);
    if (!t) return;
    const start = new Date(t.date);
    let diff = Math.floor((Date.now() - start.getTime()) / 1000);
    let negative = diff < 0;
    diff = Math.abs(diff);
    const d = Math.floor(diff / 86400);
    const h = Math.floor((diff % 86400) / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const s = diff % 60;
    card.querySelector('.d').textContent = (negative ? '-' : '') + d;
    card.querySelector('.h').textContent = h;
    card.querySelector('.m').textContent = m;
    card.querySelector('.s').textContent = s;
  });
}

listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.del');
  if (!btn) return;
  const id = btn.dataset.id;
  trackers = trackers.filter(t => t.id !== id);
  saveTrackers(trackers);
  render();
});

document.getElementById('addBtn').addEventListener('click', () => {
  document.getElementById('tName').value = '';
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('tDate').value = now.toISOString().slice(0,16);
  dlg.showModal();
});

document.getElementById('cancelBtn').addEventListener('click', () => dlg.close());

document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('tName').value.trim();
  const date = document.getElementById('tDate').value;
  if (!name || !date) return;
  trackers.push({ id: Date.now().toString(), name, date });
  saveTrackers(trackers);
  dlg.close();
  render();
});

render();
tick();
setInterval(tick, 1000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</body>
</html>
